#==============================================#
# Air Fans by RedSMURF: Configuration file #
#==============================================#

# To add a new fan, follow the example below
# [Fan Name]
# FAN_FLAGS                     = a - Players Only
# FAN_TEAM                      = 0 - None               1 - Terrorist           2 - Counter-Terrorist    3 - Both

# FAN_PUSH_STRENGTH             = Push strength
# FAN_PUSH_FREQ                 = Minimum - Maximum Frequency of push in seconds
# FAN_LENGTH                    = Length of the fan's push in units
# FAN_FRAMERATE                 = Fan's animation speed

# To make an fan available in the menu, you must defined at least it's name like this [RedSMURF's Fan]
# fan model and sound cannot be changed dynamically during gameplay

[Main Settings]
SETTING_DEFAULT_FLAGS           = 0
SETTING_DEFAULT_TEAM            = 3

SETTING_DEFAULT_SOUND           = fans/fan1.wav
SETTING_DEFAULT_BASE_STRENGTH   = 50.0
SETTING_DEFAULT_PUSH_STRENGTH   = 100.0
SETTING_DEFAULT_PUSH_FREQ       = 0.1 0.1
SETTING_DEFAULT_LENGTH          = 200.0
SETTING_DEFAULT_FRAMERATE       = 1.0

SETTING_MODEL_SMALL             = models/AirFans/fan_small.mdl
SETTING_MODEL_MEDIUM            = models/AirFans/fan_medium.mdl
SETTING_MODEL_LARGE             = models/AirFans/fan_large.mdl
SETTING_MINS_SMALL              = -58.80 -58.80 -9.10
SETTING_MAXS_SMALL              = 58.80 58.80 13.475
SETTING_MINS_MEDIUM             = -71.40 -71.40 -11.05
SETTING_MAXS_MEDIUM             = 71.40 71.40 16.3625
SETTING_MINS_LARGE              = -84.0 -84.0 -13.0
SETTING_MAXS_LARGE              = 84.0 84.0 19.25
SETTING_TRIGGER_SIZE            = 45.0 57.5 70.0
SETTING_MAX_TARGETS             = 8

SETTING_FAN_LOAD                = 1             # Whether to load saved fans data of the current map
SETTING_FAN_CHECK               = 10.0          # Maximum selection distance when checking nearby fans
SETTING_FAN_TASK                = 0.1           # Time interval in seconds to check for fans and apply their effects
SETTING_OFFSET_BASE             = 120.0         # Default forward offset when previewing fan placement
SETTING_OFFSET                  = 65.0 900.0    # Default minimum and maximum offset from the player to the fan (MIN MAX)
SETTING_OFFSET_STEP             = 10.0          # Step size when scrolling to move fan forward/backward
SETTING_GHOST_ALPHA             = 120           # Transparency level of the ghost preview model (0 - 255)
SETTING_ROTATION_STEP           = 22.5          # Step size when rotating the fan

[Weak Short]
FAN_LENGTH              = 150.0

[Strong Long]
FAN_PUSH_STRENGTH       = 350.0
FAN_LENGTH              = 300.0

[Strong Terrorist]
FAN_FLAGS               = a
FAN_TEAM                = 1
FAN_PUSH_STRENGTH       = 250.0

[Strong Counter-Terrorist]
FAN_FLAGS               = a
FAN_TEAM                = 2
FAN_PUSH_STRENGTH       = 250.0

[Players Only]
FAN_FLAGS               = c
FAN_PUSH_STRENGTH       = 250.0
